<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Confirmed — e-plant</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body data-page="order-success">
    <main style="padding:100px 0; text-align:center;">
        <div class="container">
            <div class="fade-up">
                <i class="fas fa-circle-check text-green mb-24" style="font-size:5rem;"></i>
                <h1 class="mb-12">Thank You for Your Order!</h1>
                <p class="text-muted mb-32" style="font-size:1.1rem;">Your order <span id="oid" class="fw-700 text-pri">#000</span> has been placed successfully.<br>We'll notify you when your greenery is on its way.</p>
                <div style="display:flex; justify-content:center; gap:16px;">
                    <a href="my-orders.html" class="btn btn-primary">View My Orders</a>
                    <a href="shop.html" class="btn btn-ghost">Continue Shopping</a>
                </div>
            </div>
        </div>
    </main>
    <script src="assets/js/app.js"></script>
    <script>
        const id = new URLSearchParams(window.location.search).get('id');
        if(id) document.getElementById('oid').innerText = '#' + id;
    </script>
</body>
</html>
